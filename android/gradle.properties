org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler cannot close its cache files on this Windows
# setup — the build fails with "Could not close incremental caches" on any
# plugin written in Kotlin. Turning incremental compilation off trades a
# slower rebuild for a build that completes.
kotlin.incremental=false

# Parallel module builds and the configuration cache, which pull most of that
# time back.
org.gradle.parallel=true
org.gradle.caching=true
